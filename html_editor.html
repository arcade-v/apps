
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time HTML Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
  
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1a1d24;
      --border: #343945;
      --accent: #8b5cf6;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Pixelify Sans", sans-serif;
    }

    header {
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    header button {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 12px;
      color: var(--text);
      background: #292d38;
      cursor: pointer;
    }

    header button:hover {
      background: #383d4b;
    }

    #workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 7px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .pane-header {
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .pane-header span:last-child {
      color: var(--muted);
      font-weight: 400;
      letter-spacing: normal;
      text-transform: none;
    }

    #editor {
      display: block;
      width: 100%;
      height: 100%;
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      padding: 18px;
      color: #d7d9e0;
      font: 14px/1.65 "Consolas", "Courier New", monospace;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }

    #editor:focus-visible {
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    #preview {
      width: 100%;
      height: 100%;
      flex: 1;
      border: 0;
      background: white;
    }

    #divider {
      position: relative;
      z-index: 2;
      cursor: col-resize;
      background: var(--border);
      touch-action: none;
    }

    #divider::after {
      content: "";
      position: absolute;
      inset: 0 -4px;
    }

    #divider:hover,
    #divider:focus-visible,
    #divider.dragging {
      background: var(--accent);
      outline: none;
    }

    footer {
      height: 27px;
      flex: 0 0 27px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 650px) {
      #workspace {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 7px minmax(0, 1fr);
      }

      #divider {
        cursor: row-resize;
      }

      #divider::after {
        inset: -4px 0;
      }

      header {
        padding: 0 10px;
      }

      #editor {
        padding: 12px;
        font-size: 13px;
      }
    }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
  </style>
</head>

<header>
  <h1>Real-time HTML Editor</h1>
  <div class="header-actions">
    <button id="open-preview" type="button">Open Preview ↗</button>
    <button id="reset" type="button">Reset example</button>
  </div>
</header>

  <main id="workspace">
    <section class="pane" id="editor-pane">
      <div class="pane-header">
        <span>HTML Editor</span>
        <span id="status" aria-live="polite">Ready</span>
      </div>

      <textarea
        id="editor"
        aria-label="HTML source code"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
      ></textarea>
    </section>

    <div
      id="divider"
      role="separator"
      aria-label="Resize editor and preview panes"
      aria-orientation="vertical"
      aria-valuemin="20"
      aria-valuemax="80"
      aria-valuenow="50"
      tabindex="0"
    ></div>

    <section class="pane" id="preview-pane">
      <div class="pane-header">
        <span>Live Preview</span>
        <span>Updates as you type</span>
      </div>

      <iframe
        id="preview"
        title="Rendered HTML preview"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
      ></iframe>
    </section>
  </main>

  <footer>
    <span>HTML Playground</span>
    <span id="char-count">0 characters</span>
  </footer>

  <script>
    "use strict";

    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const workspace = document.getElementById("workspace");
    const divider = document.getElementById("divider");
    const status = document.getElementById("status");
    const charCount = document.getElementById("char-count");
    const resetButton = document.getElementById("reset");

    const defaultHTML = `<h3>Welcome to the real-time HTML editor!</h3>
<p>Type HTML in the editor, and it will appear in the preview.</p>
<p>Try changing this text or adding your own elements.</p>
<button onclick="document.body.style.backgroundColor = '#def'">
  Click me!
</button>`;

    let previousHTML = null;
    let dragging = false;
    let previewTimer = null;
    let splitRatio = 0.5;

function updatePreview() {
  const html = editor.value;

  charCount.textContent =
    html.length.toLocaleString() +
    (html.length === 1 ? " character" : " characters");

  if (html === previousHTML) return;

  previousHTML = html;

  // Update the embedded preview.
  preview.srcdoc = html;

  // Update the separate about:blank tab if it is still open.
  if (previewWindow && !previewWindow.closed) {
    previewWindow.document.open();
    previewWindow.document.write(html);
    previewWindow.document.close();
  }

  status.textContent = "Preview updated";
}

    function schedulePreview() {
      status.textContent = "Updating…";
      clearTimeout(previewTimer);
      previewTimer = setTimeout(updatePreview, 100);
    }

    editor.addEventListener("input", schedulePreview);

    // Insert indentation when Tab is pressed.
    editor.addEventListener("keydown", event => {
      if (event.key === "Tab") {
        event.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        editor.setRangeText("  ", start, end, "end");
        schedulePreview();
      }
    });

    resetButton.addEventListener("click", () => {
      editor.value = defaultHTML;
      previousHTML = null;
      updatePreview();
      editor.focus();
    });
const openPreviewButton = document.getElementById("open-preview");

let previewWindow = null;

openPreviewButton.addEventListener("click", () => {
  // Open the tab directly from the click to avoid popup blocking.
  previewWindow = window.open("about:blank", "_blank");

  if (!previewWindow) {
    status.textContent = "Popup blocked — allow popups";
    return;
  }

  previewWindow.document.open();
  previewWindow.document.write(editor.value);
  previewWindow.document.close();

  status.textContent = "Preview opened in new tab";
});
    function isStacked() {
      return window.matchMedia("(max-width: 650px)").matches;
    }

    function setSplit(clientX, clientY) {
      const rect = workspace.getBoundingClientRect();
      const stacked = isStacked();

      const available = stacked ? rect.height : rect.width;
      const position = stacked
        ? clientY - rect.top
        : clientX - rect.left;

      splitRatio = Math.max(
        0.2,
        Math.min(0.8, position / available)
      );

      if (stacked) {
        workspace.style.gridTemplateRows =
          `${splitRatio * 100}% 7px ${(1 - splitRatio) * 100}%`;

        divider.setAttribute("aria-orientation", "horizontal");
      } else {
        workspace.style.gridTemplateColumns =
          `${splitRatio * 100}% 7px ${(1 - splitRatio) * 100}%`;

        divider.setAttribute("aria-orientation", "vertical");
      }

      divider.setAttribute(
        "aria-valuenow",
        Math.round(splitRatio * 100)
      );
    }

    divider.addEventListener("pointerdown", event => {
      dragging = true;
      divider.classList.add("dragging");
      divider.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    divider.addEventListener("pointermove", event => {
      if (dragging) setSplit(event.clientX, event.clientY);
    });

    function stopDragging() {
      dragging = false;
      divider.classList.remove("dragging");
    }

    divider.addEventListener("pointerup", stopDragging);
    divider.addEventListener("pointercancel", stopDragging);

    divider.addEventListener("keydown", event => {
      const horizontal = isStacked();

      const decrease = horizontal
        ? event.key === "ArrowUp"
        : event.key === "ArrowLeft";

      const increase = horizontal
        ? event.key === "ArrowDown"
        : event.key === "ArrowRight";

      if (!decrease && !increase) return;

      event.preventDefault();

      splitRatio += decrease ? -0.03 : 0.03;
      splitRatio = Math.max(0.2, Math.min(0.8, splitRatio));

      const rect = workspace.getBoundingClientRect();

      setSplit(
        rect.left + (isStacked() ? rect.width / 2 : rect.width * splitRatio),
        rect.top + (isStacked() ? rect.height * splitRatio : rect.height / 2)
      );
    });

    // Initialize the editor and render its first preview.
    editor.value = defaultHTML;
    updatePreview();
  </script>
</body>
</html>
