<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Watcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Pixelify Sans', cursive;
      color: #fff;
      margin: 2em;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }

    .embed-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background: #000;
      margin-top: 20px;
      border-radius: 10px;
    }

    .embed-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }

    #search-input {
      width: 100%;
      padding: 10px;
      font-size: 1.2em;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .watch-button {
      font-family: 'Pixelify Sans', cursive;
      margin-top: 10px;
      display: block;
      width: 100%;
      background: transparent;
      outline: 1px solid white;
      color: white;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 1.2em;
      border: none;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
    }

    .watch-button:hover {
      background: white;
      color: black;
    }

    p {
      text-align: center;
      font-size: 1.1em;
      margin-top: 1em;
    }

    #privacy-note {
      text-align: center;
      font-size: 0.9em;
      opacity: 0.8;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>YouTube Watcher</h1>

  <div id="yt"></div>

  <form id="yt-form" onsubmit="return false;">
    <input id="search-input" type="text" placeholder="Paste: ...youtube.com/watch?v=...">
    <button class="watch-button" onclick="getYouTube()">Watch YouTube video!</button>
  </form>

  <p>Paste a YouTube link or video ID. Supports youtube.com, youtu.be, or just the 11-character code.</p>
  <div id="privacy-note"></div>
<script>
    function getYouTube() {
      const input = document.getElementById('search-input').value.trim();

      // Extract 11-char video ID from multiple formats
      const match = input.match(
        /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|.*[?&]v=))([a-zA-Z0-9_-]{11})/
      );
      const videoId = match ? match[1] : input;

      const ytContainer = document.getElementById('yt');
      const embedContainer = document.createElement('div');
      embedContainer.className = 'embed-container';

      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}`;
      iframe.frameBorder = '0';
      iframe.allow =
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;

      const privacyNote = document.getElementById('privacy-note');

      // Fallback if no-cookie embed fails
      let fallbackTriggered = false;
      const fallbackTimer = setTimeout(() => {
        try {
          if (!fallbackTriggered && (!iframe.contentWindow || !iframe.contentWindow.document)) {
            fallbackTriggered = true;
            console.warn('Privacy embed failed, switching to youtube.com/embed');
            iframe.src = `https://www.youtube.com/embed/${videoId}`;
          }
        } catch (e) {
          if (!fallbackTriggered) {
            fallbackTriggered = true;
            iframe.src = `https://www.youtube.com/embed/${videoId}`;
          }
        }
      }, 2500);

      iframe.onload = () => clearTimeout(fallbackTimer);

      embedContainer.appendChild(iframe);
      ytContainer.innerHTML = '';
      ytContainer.appendChild(embedContainer);
    }

    document.getElementById('yt-form').addEventListener('submit', getYouTube);
</script>
</body>
</html>
